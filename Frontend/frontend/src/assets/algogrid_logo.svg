<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <style>
      .thick { 
        stroke-width: 8; 
        stroke-linecap: round; 
        stroke-linejoin: round; 
        fill: none; 
      }
      .thin { 
        stroke: #A0B6D9; 
        stroke-width: 2.5; 
        stroke-linecap: round; 
        stroke-linejoin: round; 
        fill: none; 
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- ================= LOGO ICON ================= -->
  
  <!-- Layer 1: Thin wireframe inner lines & radials -->
  <!-- Inner Hexagon -->
  <path class="thin" d="M 160 95 L 207.63 122.5 L 207.63 177.5 L 160 205 L 112.37 177.5 L 112.37 122.5 Z" />
  <!-- Radials extending to outer nodes -->
  <line class="thin" x1="160" y1="150" x2="160" y2="40" />
  <line class="thin" x1="160" y1="150" x2="255.26" y2="205" />
  <line class="thin" x1="160" y1="150" x2="64.74" y2="205" />

  <!-- Layer 2: Thick structural outer edges -->
  <!-- Top-Left to Top (Dark) -->
  <line class="thick" stroke="#051433" x1="64.74" y1="95" x2="160" y2="40" />
  <!-- Bottom-Left to Top-Left (Dark) -->
  <line class="thick" stroke="#051433" x1="64.74" y1="205" x2="64.74" y2="95" />
  <!-- Bottom to Bottom-Left (Dark) -->
  <line class="thick" stroke="#051433" x1="160" y1="260" x2="64.74" y2="205" />
  <!-- Bottom-Right to Bottom (Medium-Dark) -->
  <line class="thick" stroke="#163878" x1="255.26" y1="205" x2="160" y2="260" />
  <!-- Top-Right to Bottom-Right (Medium Blue) -->
  <line class="thick" stroke="#255BB3" x1="255.26" y1="95" x2="255.26" y2="205" />
  <!-- Top to Top-Right (Light Blue) -->
  <line class="thick" stroke="#3F82F0" x1="160" y1="40" x2="255.26" y2="95" />

  <!-- Layer 3: Thick structural inner radials (Cube edges) -->
  <!-- Center to Top-Left -->
  <line class="thick" stroke="#16397A" x1="160" y1="150" x2="64.74" y2="95" />
  <!-- Center to Bottom -->
  <line class="thick" stroke="#051433" x1="160" y1="150" x2="160" y2="260" />
  <!-- Center to Top-Right -->
  <line class="thick" stroke="#255BB3" x1="160" y1="150" x2="255.26" y2="95" />

  <!-- Layer 4: Nodes (Intersection Dots) -->
  <!-- Inner Hexagon Dots -->
  <g fill="#051433">
    <circle cx="160" cy="95" r="5" />
    <circle cx="207.63" cy="122.5" r="5" />
    <circle cx="207.63" cy="177.5" r="5" />
    <circle cx="160" cy="205" r="5" />
    <circle cx="112.37" cy="177.5" r="5" />
    <circle cx="112.37" cy="122.5" r="5" />
  </g>

  <!-- Outer Hexagon Dots -->
  <circle cx="160" cy="40" r="8.5" fill="#051433" />        <!-- Top -->
  <circle cx="255.26" cy="95" r="8.5" fill="#3F82F0" />     <!-- Top-Right -->
  <circle cx="255.26" cy="205" r="8.5" fill="#051433" />    <!-- Bottom-Right -->
  <circle cx="160" cy="260" r="8.5" fill="#3F82F0" />       <!-- Bottom -->
  <circle cx="64.74" cy="205" r="8.5" fill="#051433" />     <!-- Bottom-Left -->
  <circle cx="64.74" cy="95" r="8.5" fill="#051433" />      <!-- Top-Left -->

  <!-- Center Dot -->
  <circle cx="160" cy="150" r="8.5" fill="#255BB3" />

  <!-- ================= LOGO TEXT ================= -->
  
  <text x="310" y="186" font-family="'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="105" letter-spacing="-2.5">
    <tspan fill="#051433">Algo</tspan><tspan fill="#3677E0">Grid</tspan>
  </text>
</svg>
